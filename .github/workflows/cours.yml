name: Cours du jour
on:
  schedule:
    - cron: "30 17 * * 1-5"   # chaque jour de semaine vers 18h30 (heure de Paris en hiver)
    - cron: "0 22 * * 1-5"    # et après la clôture américaine
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_prices.py
      - name: Enregistrer cours.json
        run: |
          git config user.name "cours-bot"
          git config user.email "cours-bot@users.noreply.github.com"
          git add cours.json
          git diff --cached --quiet || (git commit -m "Cours du jour" && git push)
