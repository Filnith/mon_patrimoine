name: Cours du jour
on:
  schedule:
    # Horaires en UTC. Heure de Paris = UTC + 1 en hiver, UTC + 2 en été.
    - cron: "35 7-20 * * 1-5"   # chaque heure de semaine (passage léger : cours du jour)
    - cron: "15 22 * * 1-5"     # après la clôture américaine (passage complet : un an d'historique)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les cours
        run: python scripts/fetch_prices.py
        env:
          LEGER: ${{ github.event_name == 'schedule' && github.event.schedule == '35 7-20 * * 1-5' && '1' || '0' }}
      - name: Enregistrer cours.json
        run: |
          git config user.name "cours-bot"
          git config user.email "cours-bot@users.noreply.github.com"
          git add cours.json
          git diff --cached --quiet && exit 0
          git commit -m "Cours du jour"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          echo "::warning::cours.json non enregistré cette fois-ci"
